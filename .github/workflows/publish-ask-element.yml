# Publishes `@roadcast/ask-element` to GitHub Packages on every push that can
# change it, so a consumer (bolt-v2's frontend) picks the new build up with a
# plain `npm install` instead of a hand-copied tarball.
#
# **Why the version is computed here rather than committed.** npm refuses to
# republish a version that already exists, so an automatic publish needs a new
# number every run. Bumping `package.json` in CI and pushing it back would have
# this workflow commit to the branch that triggers it — a loop to suppress, and
# a race with whatever the developer pushed next. Instead `major.minor` stays
# the hand-edited source of truth in `packages/ask-element/package.json`, and CI
# owns the patch: `1.0.<run_number>`, which only ever increases. A consumer on
# `^1.0.0` therefore picks up every publish.
#
# That also means **`version` in the committed manifest is not what ships** —
# the published patch is the run number. Bump `major.minor` by hand for a
# breaking or a feature change, exactly as before.
#
# **Why `paths` and not every push.** The element is built from `src/ask/**`
# and the shared design tokens, so a change to the console's routes cannot
# affect it. A filter keeps the version from advancing on every unrelated
# commit, which would make the number meaningless as a signal.
name: Publish ask-element

on:
  push:
    branches: [main, master, boltv2-migration]
    paths:
      - "src/**"
      - "packages/ask-element/**"
      - "vite.element.config.ts"
      - "package.json"
      - ".github/workflows/publish-ask-element.yml"
  # A manual run, for republishing after a failed one without an empty commit.
  workflow_dispatch:

concurrency:
  # One publish at a time per branch. Two concurrent runs would race for the
  # same version number only if run_number collided, which it cannot — but they
  # would still publish out of order, and the later-numbered one losing is
  # confusing to debug.
  group: publish-ask-element-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this needs. `GITHUB_TOKEN` with `packages: write` is
      # what authenticates the publish, so no long-lived PAT has to exist.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc that points the scope at GitHub Packages and
          # supplies the token, so neither is committed to the repo.
          registry-url: https://npm.pkg.github.com
          scope: "@roadcast"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the element
        run: pnpm run build:element

      - name: Fail if the bundle is missing or empty
        # A vite build that emits nothing still exits 0 when the entry resolves
        # to an empty module. Publishing that produces a package that installs
        # cleanly and registers no custom element — the exact failure this
        # whole pipeline exists to avoid shipping silently.
        run: |
          set -euo pipefail
          bundle=packages/ask-element/dist/bolt-ai-ask.js
          test -s "$bundle" || { echo "::error::$bundle missing or empty"; exit 1; }
          bytes=$(wc -c <"$bundle")
          echo "bundle is $bytes bytes"
          # The real artifact is ~1MB (React is bundled in). Anything under
          # 100kB means the build lost its dependencies.
          test "$bytes" -gt 100000 || { echo "::error::bundle is implausibly small"; exit 1; }
          grep -q "bolt-ai-ask" "$bundle" || { echo "::error::custom element name absent from bundle"; exit 1; }

      - name: Set the published version
        id: version
        # major.minor from the manifest, patch from the run number.
        run: |
          set -euo pipefail
          base=$(node -p "require('./packages/ask-element/package.json').version")
          major_minor=${base%.*}
          version="${major_minor}.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          cd packages/ask-element
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "publishing $version"

      - name: Publish
        run: npm publish
        working-directory: packages/ask-element
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Published \`@roadcast/ask-element@${{ steps.version.outputs.version }}\`"
            echo
            echo "Consumers on \`^1.0.0\` pick this up with \`npm install\`."
          } >>"$GITHUB_STEP_SUMMARY"
