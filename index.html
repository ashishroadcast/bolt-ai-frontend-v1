<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Must match tokens.css, which is light and single-theme by Saurabh's
      own instruction. This said "dark" — left over from the palette that
      preceded it — and the mismatch is what "not able to select and copy
      text anywhere in app" actually was: selection worked the whole time,
      but Chrome paints the UA default ::selection for a *dark* page, and
      that wash is invisible over --surface. The same stale hint is what
      renders form controls, scrollbars and autofill for a dark page on a
      light one.
    -->
    <meta name="color-scheme" content="light" />
    <title>Bolty</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
